---

# Must run before the reset flow removes /etc/ipa, so it reflects the pre-flow state
- name: Freeipa-client-delete | Check if an IPA client is configured
  ansible.builtin.stat:
    path: /etc/ipa/default.conf
  register: ipa_client_conf
  become: true

- name: Freeipa-client | unconfigure client
  ansible.builtin.import_tasks: freeipa-reset-client.yml

- name: Freeipa-client-delete | call to ipa client uninstall
  ansible.builtin.command: "ipa-client-install --uninstall"
  become: yes
  failed_when: false
  changed_when: ipa_uninstall.rc == 0
  register: ipa_uninstall
  when: ipa_client_conf.stat.exists

- name: Freeipa-client-delete | delete freeipa package
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  become: yes
  with_items:
    - freeipa-client

- name: Freeipa-client-delete | delete freeipa generated files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: yes
  with_items:
    - /var/lib/certmonger
    - /etc/certmonger
    - /etc/idmapd.conf.ipabkp

- name: Freeipa-client-delete | reinstall krb5-libs
  ansible.builtin.command: "dnf -y reinstall krb5-libs"
  become: yes
  changed_when: true
  when: ipa_client_conf.stat.exists
